    </clipPath>
    <clipPath id="torsoClip">
      <path d="M56 114 C72 114 88 117 96 123 C101 127 102 134 100 140 C98 146 96 149 94 151 C80 156 32 156 18 151 C16 149 14 146 12 140 C10 134 11 127 16 123 C24 117 40 114 56 114 Z"/>
    </clipPath>
    <clipPath id="skirtClip">
