        <!-- 腰带 -->
        <path d="M18 144 C38 149 74 149 94 144 L94 150 C74 155 38 155 18 150 Z" fill="#a894f0"/>
        <path d="M18 144 C38 149 74 149 94 144" fill="none" stroke="#8f7ada" stroke-width="0.9"/>
        <!-- 胸口衣褶（减法：两笔） -->
        <path d="M44 122 C48 130 48 138 46 145" fill="none" stroke="#c8c0e0" stroke-width="1" stroke-linecap="round"/>
        <path d="M68 122 C64 130 64 138 66 145" fill="none" stroke="#c8c0e0" stroke-width="1" stroke-linecap="round"/>
        <!-- 领口 -->
        <path d="M56 114 C60 120 60 126 56 130 C52 126 52 120 56 114 Z" fill="#ffffff" stroke="#9c93b8" stroke-width="1"/>
      </g>
    </g>

    <!-- ========== 手臂 + 头（近层） ========== -->
    <g id="pet-chibi-top">

      <!-- 脖子 -->
      <path d="M50 104 L62 104 L62 118 L56 121 L50 118 Z" fill="#f6d9cd" stroke="#c99b8b" stroke-width="0.9"/>

      <g id="pet-head-tilt">
        <g id="pet-head">
          <animateTransform attributeName="transform" type="rotate"
            values="0 56 96; -3.2 56 96; 0 56 96; 2.8 56 96; 0 56 96"
            keyTimes="0; 0.2; 0.48; 0.76; 1"
            calcMode="spline"
            keySplines="0.45 0 0.25 1; 0.45 0 0.25 1; 0.45 0 0.25 1; 0.45 0 0.25 1"
            dur="14s" repeatCount="indefinite"/>

          <!-- 脸 -->
          <path d="M56 9 C79 9 101 27 102 56 C103 80 89 103 70 111.5 C61 115.5 51 115.5 42 111.5 C23 103 9 80 10 56 C11 27 33 9 56 9 Z"
                fill="#fdeee6" stroke="#b98a77" stroke-width="1.1"/>
          <g clip-path="url(#faceClip)">
            <!-- 一层硬阴影：右颊 + 刘海投影 -->
            <path d="M56 9 C79 9 101 27 102 56 C103 80 89 103 70 111.5 C64 114 58 115 56 115 C62 96 64 60 56 9 Z" fill="#f2d3c6"/>
            <path d="M10 56 C11 36 20 22 34 16 C30 30 30 44 34 58 C26 60 17 58 10 56 Z" fill="#f2d3c6" opacity="0.75"/>
          </g>

          <!-- 后侧发帘 -->
          <path d="M10 56 C9 84 12 104 16 120 C22 122 27 120 29 116 C25 100 24 78 26 58 Z" fill="#e9e6f5" stroke="#8d84a8" stroke-width="1.05" stroke-linejoin="round"/>
          <path d="M102 56 C103 84 100 104 96 120 C90 122 85 120 83 116 C87 100 88 78 86 58 Z" fill="#e9e6f5" stroke="#8d84a8" stroke-width="1.05" stroke-linejoin="round"/>
          <path d="M14 62 C15 82 17 100 19 114" fill="none" stroke="#cfc7e6" stroke-width="1" stroke-linecap="round"/>
          <path d="M98 62 C97 82 95 100 93 114" fill="none" stroke="#cfc7e6" stroke-width="1" stroke-linecap="round"/>

          <!-- 精灵长耳 -->
          <path d="M20 73 C14 69 6 65 1.5 66.5 C4 72.5 9 79 17 84 C20.5 86 23.5 84.5 23.5 80.5 C23.5 77.5 22 75 20 73 Z"
                fill="#fdeee6" stroke="#b98a77" stroke-width="1.05" stroke-linejoin="round"/>
          <path d="M92 73 C98 69 106 65 110.5 66.5 C108 72.5 103 79 95 84 C91.5 86 88.5 84.5 88.5 80.5 C88.5 77.5 90 75 92 73 Z"
                fill="#fdeee6" stroke="#b98a77" stroke-width="1.05" stroke-linejoin="round"/>
          <path d="M18 76 C12 73 6 70 2.5 69.5 C6 74 10 78 16 81.5" fill="none" stroke="#e7c0af" stroke-width="0.9" stroke-linecap="round"/>
          <path d="M94 76 C100 73 106 70 109.5 69.5 C106 74 102 78 96 81.5" fill="none" stroke="#e7c0af" stroke-width="0.9" stroke-linecap="round"/>

          <!-- 刘海 -->
          <path d="M14 56 C15 32 32 14 56 14 C80 14 97 32 98 56 C98 60 97 63 96 64 C93 52 88 44 82 40 C80 50 74 58 66 62 C67 52 65 44 61 38 C55 46 47 52 38 55 C36 47 33 41 29 37 C24 45 20 54 18 64 C16 62 14 59 14 56 Z"
                fill="#f2f0fb" stroke="#8d84a8" stroke-width="1.1" stroke-linejoin="round"/>
          <g clip-path="url(#bangsClip)">
            <path d="M14 40 C30 20 82 20 98 40 C98 50 96 58 92 62 C86 46 74 38 56 38 C38 38 26 46 20 62 C16 58 14 50 14 40 Z" fill="#dcd6ee"/>
            <path d="M32 34 C38 30 44 28 50 28" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.85" stroke-linecap="round"/>
          </g>

          <!-- 发饰：星形 -->
          <g transform="translate(85,30)">
            <g fill="#e6dcff" stroke="#8f7ada" stroke-width="1" stroke-linejoin="round">
              <ellipse cx="0" cy="-5.6" rx="3.1" ry="4.2"/>
              <ellipse cx="5.3" cy="-1.7" rx="3.1" ry="4.2" transform="rotate(72 5.3 -1.7)"/>
              <ellipse cx="3.3" cy="4.6" rx="3.1" ry="4.2" transform="rotate(144 3.3 4.6)"/>
              <ellipse cx="-3.3" cy="4.6" rx="3.1" ry="4.2" transform="rotate(216 -3.3 4.6)"/>
              <ellipse cx="-5.3" cy="-1.7" rx="3.1" ry="4.2" transform="rotate(288 -5.3 -1.7)"/>
            </g>
            <circle cx="0" cy="0" r="2.4" fill="#fff3b0" stroke="#d9b64a" stroke-width="0.9"/>
          </g>

          <!-- 眉（细、弯） -->
