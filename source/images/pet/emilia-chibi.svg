<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 170" width="120" height="170" role="img" aria-label="银发少女桌宠">
  <defs>
    <linearGradient id="hairG" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fdfdff"/>
      <stop offset="0.55" stop-color="#e9e8f6"/>
      <stop offset="1" stop-color="#cfcce4"/>
    </linearGradient>
    <linearGradient id="dressG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e5fb"/>
    </linearGradient>
    <linearGradient id="ribbonG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9b8ff"/>
      <stop offset="1" stop-color="#8f7cf0"/>
    </linearGradient>
    <radialGradient id="cheekG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb3c8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffb3c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="pet-body">
    <!-- 后发（长发垂落） -->
    <path d="M60 14c-20 0-33 13-33 31 0 9 2 17 4 24-3 12-4 26-2 38h8c-2-13-1-27 2-38 2 6 6 9 10 10-3-9-4-19-2-27 3-12 12-18 26-18s23 6 26 18c2 8 1 18-2 27 4-1 8-4 10-10 3 11 4 25 2 38h8c2-12 1-26-2-38 2-7 4-15 4-24 0-18-13-31-33-31z"
          fill="url(#hairG)" stroke="#cdc9e3" stroke-width="0.9"/>

    <!-- 裙摆（收腰，A 字） -->
    <path d="M60 82c-9 0-14 4-16 11l-6 30c-1 5 2 8 7 8h30c5 0 8-3 7-8l-6-30c-2-7-7-11-16-11z"
          fill="url(#dressG)" stroke="#d8d3f0" stroke-width="0.9"/>
    <path d="M46 121h28" stroke="#cbbcf5" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 4"/>
    <!-- 腰线 -->
    <path d="M49 95h22" stroke="#b9a7f0" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>

    <!-- 手臂 -->
    <path d="M44 92c-4 3-6 7-6 11" fill="none" stroke="#ffe3da" stroke-width="5" stroke-linecap="round"/>
    <path d="M76 92c4 3 6 7 6 11" fill="none" stroke="#ffe3da" stroke-width="5" stroke-linecap="round"/>
    <!-- 手 -->
    <circle cx="38" cy="104" r="2.6" fill="#ffe3da"/>
    <circle cx="82" cy="104" r="2.6" fill="#ffe3da"/>

    <!-- 腿 -->
    <path d="M54 131v10M66 131v10" stroke="#ffe3da" stroke-width="5" stroke-linecap="round"/>
    <path d="M51.5 143h6M62.5 143h6" stroke="#8f7cf0" stroke-width="3" stroke-linecap="round"/>

    <!-- 头 -->
    <ellipse cx="60" cy="48" rx="24" ry="22.5" fill="#fff1ea" stroke="#f2dcd1" stroke-width="0.9"/>

    <!-- 刘海 -->
    <path d="M36 46c0-14 11-24 24-24s24 10 24 24c0 3-1 5-2 7-2-7-6-10-11-11 1 4 1 7-1 10-2-6-5-9-10-10 0 3-1 6-3 8-2-5-5-7-9-7-3 0-5 1-7 4-2 2-3 4-3 7-2-2-2-5-2-8z"
          fill="url(#hairG)" stroke="#d3cfe8" stroke-width="0.9"/>
    <!-- 两侧长发 -->
    <path d="M37 42c-4 9-5 20-4 30 0 6 2 9 5 10-2-11-2-24 0-34z" fill="url(#hairG)" stroke="#d3cfe8" stroke-width="0.9"/>
    <path d="M83 42c4 9 5 20 4 30 0 6-2 9-5 10 2-11 2-24 0-34z" fill="url(#hairG)" stroke="#d3cfe8" stroke-width="0.9"/>

    <!-- 星星发饰 -->
    <g transform="translate(84,30)">
      <path d="M0-6.5l1.9 4.1 4.5.5-3.4 3 1 4.4L0 3.3l-4 2.2 1-4.4-3.4-3 4.5-.5z" fill="#ffd76e" stroke="#f0b93c" stroke-width="0.7"/>
    </g>
    <!-- 蝴蝶结 -->
    <g transform="translate(60,74)">
      <path d="M0 0l-7-4v8z" fill="url(#ribbonG)"/>
      <path d="M0 0l7-4v8z" fill="url(#ribbonG)"/>
      <circle r="1.8" fill="#fff" opacity="0.9"/>
    </g>

    <!-- 眼睛（大眼 + 高光） -->
    <g>
      <ellipse cx="50" cy="51" rx="6" ry="7" fill="#8f7cf0"/>
      <ellipse cx="70" cy="51" rx="6" ry="7" fill="#8f7cf0"/>
      <ellipse cx="50" cy="52.5" rx="3.8" ry="4.6" fill="#5a48b5"/>
      <ellipse cx="70" cy="52.5" rx="3.8" ry="4.6" fill="#5a48b5"/>
      <circle cx="51.8" cy="48.8" r="1.9" fill="#fff"/>
      <circle cx="71.8" cy="48.8" r="1.9" fill="#fff"/>
      <circle cx="48.6" cy="55" r="1" fill="#fff" opacity="0.8"/>
      <circle cx="68.6" cy="55" r="1" fill="#fff" opacity="0.8"/>
    </g>
    <!-- 睫毛 -->
    <path d="M43.5 45.5q6-3 11-0.5M65.5 45q5-2.5 11 0.5" stroke="#c9c4e4" stroke-width="1.3" fill="none" stroke-linecap="round"/>
    <!-- 腮红 -->
    <ellipse cx="45" cy="60" rx="4.6" ry="3" fill="url(#cheekG)"/>
    <ellipse cx="75" cy="60" rx="4.6" ry="3" fill="url(#cheekG)"/>
    <!-- 嘴 -->
    <path d="M57.5 63q2.5 2.6 5 0" stroke="#e28d9e" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- 漂浮星星装饰 -->
  <g id="pet-sparkles" fill="#ffe08a">
    <path d="M22 34l1.2 2.6 2.8.3-2.1 1.9.6 2.8-2.5-1.4-2.5 1.4.6-2.8-2.1-1.9 2.8-.3z" opacity="0.9">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="2.8s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M99 96l1 2.1 2.3.2-1.7 1.6.5 2.3-2.1-1.2-2.1 1.2.5-2.3-1.7-1.6 2.3-.2z" opacity="0.75">
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.1s" begin="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.5; 0 0" dur="3.1s" begin="0.9s" repeatCount="indefinite"/>
    </path>
    <path d="M30 118l0.9 1.9 2 .2-1.5 1.4.4 2-1.8-1-1.8 1 .4-2-1.5-1.4 2-.2z" opacity="0.6">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3.5; 0 0" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
