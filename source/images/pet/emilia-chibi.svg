      <g clip-path="url(#armLClip)"><path d="M22 124 C16 132 12 142 12 154 C12 162 14 166 18 167 L12 168 C8 166 7 158 8 150 C9 138 14 127 20 122 Z" fill="#f2d3c6"/></g>
      <!-- 左手 -->
      <path d="M13 166 C8 168 5 173 6 177 C7 181 12 183 16 181 C20 179 21 174 20 170 C19 166 16 165 13 166 Z"
            fill="#fdeee6" stroke="#b98a77" stroke-width="1.05" stroke-linejoin="round"/>
      <path d="M8 174 C10 176 14 177 18 176" fill="none" stroke="#e3b9a8" stroke-width="0.8" stroke-linecap="round"/>

      <!-- 右臂（举起打招呼） -->
      <path d="M94 122 C101 116 105 106 106 96 C106.5 90 103 86 99 88 C95 90 93 99 91 107 C89 116 89 121 89 125 Z"
            fill="#fdeee6" stroke="#b98a77" stroke-width="1.05" stroke-linejoin="round"/>
      <g clip-path="url(#armRClip)"><path d="M96 122 C102 114 104 104 104 96 C104 91 101 88 98 89 C100 98 100 110 96 120 Z" fill="#f2d3c6"/></g>
      <!-- 右手（张开招手） -->
      <path d="M99 86 C95 83 90 83 87 86 C85 89 86 93 89 95 C92 97 96 97 99 95 C102 92 102 88 99 86 Z"
            fill="#fdeee6" stroke="#b98a77" stroke-width="1.05" stroke-linejoin="round"/>
      <path d="M88 87 L86 84 M92 84 L91 80 M96 84 L96 80 M99 87 L102 84" fill="none" stroke="#b98a77" stroke-width="1" stroke-linecap="round"/>

    <!-- 编发：左肩前的麻花辫 -->
    <g id="pet-braid" stroke="#8d84a8" stroke-width="1" stroke-linejoin="round">
      <ellipse cx="23.4" cy="116" rx="6.4" ry="4.9" fill="#f2f0fb" transform="rotate(-24 23.4 116)"/>
      <ellipse cx="24.6" cy="125" rx="6.4" ry="4.9" fill="#e9e6f5" transform="rotate(22 24.6 125)"/>
      <ellipse cx="23.6" cy="134" rx="6.4" ry="4.9" fill="#f2f0fb" transform="rotate(-22 23.6 134)"/>
      <ellipse cx="24.8" cy="143" rx="6.4" ry="4.9" fill="#e9e6f5" transform="rotate(22 24.8 143)"/>
      <ellipse cx="24" cy="152" rx="6.2" ry="4.7" fill="#f2f0fb" transform="rotate(-20 24 152)"/>
      <ellipse cx="25" cy="161" rx="5.8" ry="4.4" fill="#e9e6f5" transform="rotate(20 25 161)"/>
      <ellipse cx="25.4" cy="169.5" rx="5.2" ry="4" fill="#f2f0fb" transform="rotate(-18 25.4 169.5)"/>
      <path d="M24.6 175 C24.6 179 24 182 23.4 185" fill="none" stroke="#a894f0" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M26.4 175 C26.6 179 26.4 182 26 185" fill="none" stroke="#c9b8ff" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- 前景星点 -->
    <g id="pet-sparkles">
      <path d="M20 30 L21.2 34 L25 35.2 L21.2 36.4 L20 40.4 L18.8 36.4 L15 35.2 L18.8 34 Z" fill="#ffe08a">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/>
      </path>
      <path d="M100 128 L101 131 L104 132 L101 133 L100 136 L99 133 L96 132 L99 131 Z" fill="#ffe08a">
        <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.8s" begin="0.9s" repeatCount="indefinite"/>
      </path>
      <path d="M14 150 L14.8 152.6 L17.4 153.4 L14.8 154.2 L14 156.8 L13.2 154.2 L10.6 153.4 L13.2 152.6 Z" fill="#ffe08a">
        <animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.6s" begin="1.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
