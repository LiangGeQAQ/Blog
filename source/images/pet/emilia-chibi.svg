          <path d="M80 52 C76 48.5 69 48 65 50" fill="none" stroke="#a99cc4" stroke-width="1.5" stroke-linecap="round"/>

          <!-- 眼睛：保留原瞳孔形状（竖长杏仁）+ 紫色系 -->
          <g id="pet-eyes">
            <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.9;0.925;0.965;0.99;1" dur="7.5s" repeatCount="indefinite"/>
            <g id="eyeShapeL">
              <path d="M28 74 C28 64 34 57 41 57 C48 57 52 64 52 74 C52 82 47 88 40 88 C33 88 28 82 28 74 Z" fill="#ffffff" stroke="#a99cc4" stroke-width="1.1"/>
              <path d="M31 74 C31 65 36 60 41 60 C46 60 49 65 49 74 C49 81 46 85 40 85 C34 85 31 81 31 74 Z" fill="#8f7ae0"/>
              <path d="M33 78 C33 71 37 66 41 66 C45 66 47 71 47 78 C47 83 45 86 40 86 C35 86 33 83 33 78 Z" fill="#6b55c9"/>
              <path d="M36 76 C36 72 38 69 41 69 C44 69 45 72 45 76 C45 80 44 82 40 82 C37 82 36 80 36 76 Z" fill="#3b2f74"/>
              <circle cx="44" cy="68" r="3" fill="#ffffff"/>
              <circle cx="37.5" cy="80" r="1.5" fill="#ffffff" opacity="0.85"/>
              <path d="M27.6 71 C31.4 62.6 38 58 43.6 58" fill="none" stroke="#7d6aa8" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M52 71 C51 78 47 84 42 87" fill="none" stroke="#b7a9d4" stroke-width="1.1" stroke-linecap="round"/>
            </g>
            <use xlink:href="#eyeShapeL" transform="translate(112 0) scale(-1 1)"/>
          </g>

          <g id="pet-eyes-closed" opacity="0">
            <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.9;0.925;0.965;0.99;1" dur="7.5s" repeatCount="indefinite"/>
            <g id="eyeClosedL">
              <path d="M28 76 C34 82 46 82 52 75" fill="none" stroke="#7d6aa8" stroke-width="1.8" stroke-linecap="round"/>
            </g>
            <use xlink:href="#eyeClosedL" transform="translate(112 0) scale(-1 1)"/>
          </g>

          <!-- 腮红 -->
          <ellipse cx="26" cy="90" rx="7" ry="3.6" fill="#ffc3cf" opacity="0.55"/>
          <ellipse cx="86" cy="90" rx="7" ry="3.6" fill="#ffc3cf" opacity="0.55"/>

          <!-- 嘴：小幅上扬 -->
          <path d="M53 98.6 C55.2 100.8 57.6 100.9 59.4 99" fill="none" stroke="#c98a94" stroke-width="1.15" stroke-linecap="round"/>
        </g>
      </g>
    </g>

      <!-- 左臂（休息下垂） -->
      <path d="M20 122 C13 128 9 139 8 151 C7 160 9 167 13 168 C17 169 19 163 20 156 C22 144 24 132 28 126 Z"
