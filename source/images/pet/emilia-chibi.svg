<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 136" width="128" height="136" role="img" aria-label="银发紫瞳少女桌宠">
  <defs>
    <linearGradient id="hairTop" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#efeefa"/>
      <stop offset="1" stop-color="#c7c2e0"/>
    </linearGradient>
    <linearGradient id="hairLock" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fdfdff"/>
      <stop offset="0.5" stop-color="#e3dff5"/>
      <stop offset="1" stop-color="#b8b2d6"/>
    </linearGradient>
    <linearGradient id="dressBody" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#f2effc"/>
      <stop offset="1" stop-color="#d4cdee"/>
    </linearGradient>
    <!-- 桌面：薄板，上表面亮、立面暗 -->
    <linearGradient id="deskTop" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ded4fc"/>
      <stop offset="0.6" stop-color="#b8a7f1"/>
      <stop offset="1" stop-color="#a08ce8"/>
    </linearGradient>
    <linearGradient id="deskFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d57c9"/>
      <stop offset="0.5" stop-color="#584796"/>
      <stop offset="1" stop-color="#40317f"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cbbaff"/>
      <stop offset="1" stop-color="#7b63e6"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#453496"/>
      <stop offset="0.58" stop-color="#7b68e0"/>
      <stop offset="1" stop-color="#ad9aef"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.45" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#fffaf7"/>
      <stop offset="0.7" stop-color="#ffe9dd"/>
      <stop offset="1" stop-color="#f1cbbc"/>
    </radialGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9db6" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ff9db6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="soft2">
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <!-- 脖子裁剪：阴影只在脖子轮廓内 -->
    <clipPath id="neckClip">
      <path d="M56 84h16v12l-8 4-8-4z"/>
    </clipPath>
  </defs>

  <!-- ===== 后发（尖角收尾） ===== -->
  <path d="M64 12 L78 17 L88 30 L90 47 L84 62 L88 92 L90 104 L38 104 L40 92 L44 62 L38 47 L40 30 L50 17 Z"
        fill="#cdc8e3"/>
  <path d="M64 14 L76 19 L85 31 L87 47 L81 61 L85 92 L86 101 L42 101 L43 92 L47 61 L41 47 L43 31 L52 19 Z"
        fill="url(#hairTop)"/>

  <!-- ===== 身体（直线肩线） ===== -->
  <path d="M64 92 L78 95 L86 100 L90 112 L38 112 L42 100 L50 95 Z" fill="url(#dressBody)"/>
  <path d="M64 92 L74 94 L78 97 L64 101 L50 97 L54 94 Z" fill="#ffffff" opacity="0.72"/>
  <path d="M53 96.5 L64 105 L75 96.5" fill="none" stroke="#9c88ee" stroke-width="2.4" stroke-linejoin="miter" stroke-linecap="butt"/>
  <g transform="translate(64,106)">
    <path d="M0 0l-7.6-4.2v8.4z" fill="url(#ribbon)"/>
    <path d="M0 0l7.6-4.2v8.4z" fill="url(#ribbon)"/>
    <path d="M0 0l-2.1 6.4 2.1 1.6 2.1-1.6z" fill="#6a55d6" opacity="0.9"/>
    <path d="M-1.9 -1.9 L1.9 -1.9 L1.9 1.9 L-1.9 1.9 Z" fill="#ffffff"/>
  </g>

  <!-- ===== 桌面：薄长方体（俯视） ===== -->
  <ellipse cx="64" cy="129" rx="58" ry="5.4" fill="#33256f" opacity="0.3" filter="url(#soft)"/>
  <!-- 上表面：远边 116、近边 124（轻微收缩），高度 10 -->
  <path d="M6 112 L122 112 L126 122 L2 122 Z" fill="url(#deskTop)"/>
  <!-- 前立面：高度 8，近似垂直 -->
  <path d="M2 122 L126 122 L125 130 L3 130 Z" fill="url(#deskFront)"/>
  <!-- 硬边高光 -->
  <path d="M6 112 L122 112" stroke="#f3eeff" stroke-width="1.6" stroke-linecap="butt"/>
  <path d="M9 114 L119 114" stroke="#ffffff" stroke-width="0.9" opacity="0.35" stroke-linecap="butt"/>
  <path d="M2 122 L126 122" stroke="#33256f" stroke-width="1.1" opacity="0.55" stroke-linecap="butt"/>

  <!-- ===== 手臂（搭在桌面上，硬朗轮廓） ===== -->
  <path d="M42 99 L34 107 L31 116 L32 120 L38 120 L41 114 L45 103 Z" fill="#ffe9de"/>
  <path d="M86 99 L94 107 L97 116 L96 120 L90 120 L87 114 L83 103 Z" fill="#ffe9de"/>
  <path d="M33 108 L31.5 116 L33 119.5" fill="none" stroke="#eec7b8" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M95 108 L96.5 116 L95 119.5" fill="none" stroke="#eec7b8" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- 手背 -->
  <path d="M30 120 L28 124 L36 125 L41 122 L40 119 Z" fill="#fff5ef"/>
  <path d="M98 120 L100 124 L92 125 L87 122 L88 119 Z" fill="#fff5ef"/>

  <!-- ===== 脖子（裁剪阴影） ===== -->
  <path d="M56 84 L72 84 L72 96 L64 100 L56 96 Z" fill="#f6d7c9"/>
  <g clip-path="url(#neckClip)">
    <ellipse cx="64" cy="85.5" rx="11" ry="5.5" fill="#b98a78" opacity="0.45" filter="url(#soft2)"/>
    <ellipse cx="64" cy="98" rx="9" ry="3.2" fill="#b98a78" opacity="0.25" filter="url(#soft2)"/>
  </g>

  <!-- ===== 头部（转头 + 眨眼） ===== -->
  <g id="pet-head">
    <animateTransform attributeName="transform" type="rotate"
      values="0 64 88; -5.5 64 88; 0 64 88; 4.8 64 88; 0 64 88"
      keyTimes="0; 0.2; 0.48; 0.76; 1"
      calcMode="spline"
      keySplines="0.45 0 0.25 1; 0.45 0 0.25 1; 0.45 0 0.25 1; 0.45 0 0.25 1"
      dur="14s" repeatCount="indefinite"/>

    <!-- 脸：多边形轮廓（棱角分明） -->
    <path d="M64 29 L76 31 L85 39 L88.5 51 L88 60 L83 71 L75 80 L67 85.5 L61 85.5 L53 80 L45 71 L40 60 L39.5 51 L43 39 L52 31 Z"
          fill="url(#skin)"/>
    <!-- 右侧暗面（切面感） -->
    <path d="M76 31 L85 39 L88.5 51 L88 60 L83 71 L75 80 L67 85.5 L64 85.5 L64 31 Z" fill="#e9b6a3" opacity="0.22"/>
    <!-- 下颌高光 -->
    <path d="M58 77 L64 82.5 L70 77 L64 79.5 Z" fill="#ffffff" opacity="0.4"/>

    <!-- 刘海：尖锐发梢 -->
    <path d="M39.5 52 L43 38 L51 30 L58 26 L64 30 L70 26 L77 30 L85 38 L88.5 52 L87 59 L79 47 L72 41 L67 52 L61 41 L54 47 L47 57 L43 63 L41 55 Z"
          fill="url(#hairTop)"/>
    <path d="M47 33 L56 28 L64 32 L58 40 L50 41 Z" fill="#ffffff" opacity="0.6"/>
    <path d="M72 33 L79 38 L74 45 L68 40 Z" fill="#ffffff" opacity="0.42"/>
    <path d="M61 28 L64 41 L67 28" fill="url(#hairTop)"/>
    <!-- 侧发（直角收尾） -->
    <path d="M39.5 50 L34 62 L35 96 L43 100 L43.5 66 Z" fill="url(#hairLock)"/>
    <path d="M88.5 50 L94 62 L93 96 L85 100 L84.5 66 Z" fill="url(#hairLock)"/>
    <path d="M37.5 62 L38.5 92" stroke="#ffffff" stroke-width="1.4" opacity="0.7" stroke-linecap="butt"/>
    <path d="M90.5 62 L89.5 92" stroke="#ffffff" stroke-width="1.4" opacity="0.7" stroke-linecap="butt"/>

    <!-- 发饰：四角星 + 小花 -->
    <g transform="translate(90,36)">
      <path d="M0 -8 L1.9 -2.2 L7.6 0 L1.9 2.2 L0 8 L-1.9 2.2 L-7.6 0 L-1.9 -2.2 Z" fill="#c3b1ff" stroke="#8f7ce8" stroke-width="0.8"/>
      <path d="M0 -4 L0.9 -1 L3.8 0 L0.9 1 L0 4 L-0.9 1 L-3.8 0 L-0.9 -1 Z" fill="#fff4c9"/>
    </g>

    <!-- 眼睛：杏仁形（尖角） -->
    <g id="pet-eyes">
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.9;0.925;0.965;0.99;1" dur="7.5s" repeatCount="indefinite"/>
      <path d="M47 57 L52.4 51.4 L57 55.4 L56.6 60.6 L51.6 63.4 L47.4 60.4 Z" fill="url(#iris)"/>
      <path d="M81 57 L75.6 51.4 L71 55.4 L71.4 60.6 L76.4 63.4 L80.6 60.4 Z" fill="url(#iris)"/>
      <path d="M48.6 58 L52.4 53.6 L55.4 56.6 L55 59.8 L51.8 61.6 L49 59.6 Z" fill="#3b2c86" opacity="0.85"/>
      <path d="M79.4 58 L75.6 53.6 L72.6 56.6 L73 59.8 L76.2 61.6 L79 59.6 Z" fill="#3b2c86" opacity="0.85"/>
      <circle cx="53" cy="55.4" r="1.4" fill="#ffffff" opacity="0.9"/>
      <circle cx="75" cy="55.4" r="1.4" fill="#ffffff" opacity="0.9"/>
      <path d="M47.4 55.4 L53 51.2 L57.2 55" stroke="#4d3b9d" stroke-width="1.5" fill="none" stroke-linejoin="miter" opacity="0.7"/>
      <path d="M80.6 55.4 L75 51.2 L70.8 55" stroke="#4d3b9d" stroke-width="1.5" fill="none" stroke-linejoin="miter" opacity="0.7"/>
    </g>
    <g id="pet-eyes-closed" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.9;0.925;0.965;0.99;1" dur="7.5s" repeatCount="indefinite"/>
      <path d="M47.6 58 L52.4 60.4 L57.2 58" stroke="#6b57bd" stroke-width="1.5" fill="none" stroke-linejoin="miter"/>
      <path d="M70.8 58 L75.6 60.4 L80.4 58" stroke="#6b57bd" stroke-width="1.5" fill="none" stroke-linejoin="miter"/>
    </g>

    <!-- 眉（直线段） -->
    <path d="M47.4 46.4 L56.6 44.8" stroke="#bdb6d8" stroke-width="1.8" stroke-linecap="butt"/>
    <path d="M80.6 46.4 L71.4 44.8" stroke="#bdb6d8" stroke-width="1.8" stroke-linecap="butt"/>
    <!-- 腮红 -->
    <ellipse cx="48" cy="68" rx="4.6" ry="2.6" fill="url(#blush)"/>
    <ellipse cx="80" cy="68" rx="4.6" ry="2.6" fill="url(#blush)"/>
    <!-- 嘴（折线） -->
    <path d="M60.8 72.6 L64 74.6 L67.2 72.6" stroke="#d98195" stroke-width="1.4" fill="none" stroke-linejoin="miter" stroke-linecap="butt"/>
  </g>

  <!-- ===== 漂浮星星（四角，棱角化） ===== -->
  <g fill="#ffe08a">
    <path d="M16 27 L17.8 33 L24 35 L17.8 37 L16 43 L14.2 37 L8 35 L14.2 33 Z" opacity="0.85">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="3.4s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M112 60 L113.3 64 L117 65.4 L113.3 66.8 L112 71 L110.7 66.8 L107 65.4 L110.7 64 Z" opacity="0.75">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.8s" begin="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.6; 0 0" dur="3.8s" begin="0.9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
