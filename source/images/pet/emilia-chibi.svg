<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 132" width="120" height="132" role="img" aria-label="银发少女桌宠">
  <defs>
    <linearGradient id="hairBase" x1="0.15" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#eceaf8"/>
      <stop offset="1" stop-color="#c3bfdd"/>
    </linearGradient>
    <linearGradient id="hairSide" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#d8d4ea"/>
      <stop offset="1" stop-color="#f6f5ff"/>
    </linearGradient>
    <linearGradient id="dressG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#efecfb"/>
      <stop offset="1" stop-color="#d9d3f2"/>
    </linearGradient>
    <linearGradient id="ledgeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7a6ef"/>
      <stop offset="0.35" stop-color="#8e79e2"/>
      <stop offset="1" stop-color="#5d49bd"/>
    </linearGradient>
    <linearGradient id="ribbonG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c3b4ff"/>
      <stop offset="1" stop-color="#7a63e6"/>
    </linearGradient>
    <radialGradient id="skinG" cx="0.42" cy="0.34" r="0.75">
      <stop offset="0" stop-color="#fff6f0"/>
      <stop offset="0.7" stop-color="#ffe7dc"/>
      <stop offset="1" stop-color="#f3cdbf"/>
    </radialGradient>
    <radialGradient id="cheekG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9fb8" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff9fb8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="irisG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a37a6"/>
      <stop offset="0.55" stop-color="#8a76ea"/>
      <stop offset="1" stop-color="#c3b6ff"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="1.1"/>
    </filter>
  </defs>

  <!-- 后发体积 -->
  <path d="M60 10c-19 0-31 12-31 29 0 8 1.5 15 3.5 21l-4 30c-0.6 4 2 6 5.5 6h52c3.5 0 6-2 5.5-6l-4-30c2-6 3.5-13 3.5-21 0-17-12-29-31-29z"
        fill="url(#hairBase)"/>
  <!-- 后发右侧暗部 -->
  <path d="M74 16c9 4 14 13 14 23 0 8-1 15-3 21l4 30c0.5 4-2 6-5.5 6h6c3.5 0 6-2 5.5-6l-4-30c2-6 3-13 3-21 0-10-5-19-14-23z"
        fill="#b9b4d6" opacity="0.55"/>

  <!-- 肩膀 / 裙 -->
  <path d="M60 80c-13 0-22 6-25 15l-3 12h56l-3-12c-3-9-12-15-25-15z" fill="url(#dressG)"/>
  <path d="M60 80c-6 0-11 1-15 4 4 3 9 5 15 5s11-2 15-5c-4-3-9-4-15-4z" fill="#ffffff" opacity="0.75"/>
  <!-- 领口 -->
  <path d="M49 84c3 6 7 9 11 9s8-3 11-9" fill="none" stroke="#a48ff0" stroke-width="2.6" stroke-linecap="round"/>
  <!-- 蝴蝶结 -->
  <g transform="translate(60,92)">
    <path d="M0 0l-7.5-4.2v8.4z" fill="url(#ribbonG)"/>
    <path d="M0 0l7.5-4.2v8.4z" fill="url(#ribbonG)"/>
    <path d="M0 0l-2 6 2 1.6 2-1.6z" fill="#6d57d8" opacity="0.85"/>
    <circle r="2" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- 桌沿 -->
  <rect x="2" y="106" width="116" height="16" rx="8" fill="url(#ledgeG)"/>
  <rect x="6" y="107.5" width="108" height="3" rx="1.5" fill="#ffffff" opacity="0.45"/>
  <ellipse cx="60" cy="106" rx="46" ry="5" fill="#3b2c86" opacity="0.28" filter="url(#softShadow)"/>

  <!-- 手臂（搭在桌沿上） -->
  <path d="M38 92c-5 3-8 8-8 13 0 2 2 3 4 3 3 0 5-2 6-5 1-4 2-8 4-10z" fill="#ffe7dc"/>
  <path d="M82 92c5 3 8 8 8 13 0 2-2 3-4 3-3 0-5-2-6-5-1-4-2-8-4-10z" fill="#ffe7dc"/>
  <path d="M32 100c-1 4 0 7 2 8 2 1 5 0 6-2" fill="none" stroke="#ecc7ba" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <path d="M88 100c1 4 0 7-2 8-2 1-5 0-6-2" fill="none" stroke="#ecc7ba" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <!-- 手 -->
  <ellipse cx="34" cy="107" rx="6" ry="4" fill="#fff2eb"/>
  <ellipse cx="86" cy="107" rx="6" ry="4" fill="#fff2eb"/>

  <!-- 脖子 -->
  <path d="M53 72h14v10c0 3-3 5-7 5s-7-2-7-5z" fill="#f6d6c8"/>
  <ellipse cx="60" cy="80" rx="9" ry="4" fill="#3b2c86" opacity="0.16" filter="url(#blur1)"/>

  <!-- 脸 -->
  <ellipse cx="60" cy="50" rx="24.5" ry="23" fill="url(#skinG)"/>
  <!-- 脸侧阴影（立体感） -->
  <path d="M78 34c5 5 7 11 7 16 0 13-11 23-25 23-4 0-8-1-11-3 5 6 12 9 18 9 13 0 24-10 24-23 0-6-4-16-13-22z"
        fill="#e9b9a8" opacity="0.35" filter="url(#blur1)"/>

  <!-- 刘海（分层） -->
  <path d="M35 46c0-15 11-25 25-25s25 10 25 25c0 3-0.5 5-1.5 7-2-7-6-10-11-11 1 4 0.5 7-1 10-2-6-6-9-11-9.5 0.5 3-0.5 6-2.5 8-2-5-5-7-9-7-3 0-5.5 1.5-7.5 4-2 2-3 5-3 7-2-2-3-5-3-8z"
        fill="url(#hairBase)"/>
  <!-- 刘海暗部 -->
  <path d="M41 33c4-8 11-12 19-12 7 0 13 3 17 9-3-2-7-3-11-3-9 0-17 2-25 6z" fill="#cdc9e2" opacity="0.6"/>
  <!-- 刘海高光 -->
  <path d="M44 27c5-4 11-6 17-6 4 0 8 1 11 2-6-0.5-13 0.5-19 3-4 2-7 4-9 7z" fill="#ffffff" opacity="0.85"/>

  <!-- 侧发 -->
  <path d="M36 42c-4 8-5 18-4 28 0.5 6 2.5 9 5.5 10-2-11-2.5-24-1.5-38z" fill="url(#hairSide)"/>
  <path d="M84 42c4 8 5 18 4 28-0.5 6-2.5 9-5.5 10 2-11 2.5-24 1.5-38z" fill="url(#hairSide)"/>

  <!-- 发饰：星星 -->
  <g transform="translate(85,31)">
    <path d="M0-7l2 4.5 4.9.5-3.7 3.2 1.1 4.8L0 3.4l-4.3 2.6 1.1-4.8-3.7-3.2 4.9-.5z" fill="#ffd76e" stroke="#eab233" stroke-width="0.7"/>
    <path d="M0-4.4l1 2.4 2.6.3-2 1.7.6 2.6L0 1.4l-2.2 1.2.6-2.6-2-1.7 2.6-.3z" fill="#fff4c9" opacity="0.9"/>
  </g>

  <!-- 眼睛 -->
  <g>
    <ellipse cx="49" cy="53" rx="6.4" ry="7.4" fill="url(#irisG)"/>
    <ellipse cx="71" cy="53" rx="6.4" ry="7.4" fill="url(#irisG)"/>
    <ellipse cx="49" cy="54.5" rx="3.9" ry="5" fill="#3a2a88" opacity="0.85"/>
    <ellipse cx="71" cy="54.5" rx="3.9" ry="5" fill="#3a2a88" opacity="0.85"/>
    <circle cx="51" cy="50" r="2.1" fill="#ffffff"/>
    <circle cx="73" cy="50" r="2.1" fill="#ffffff"/>
    <circle cx="47.4" cy="57" r="1.1" fill="#ffffff" opacity="0.85"/>
    <circle cx="69.4" cy="57" r="1.1" fill="#ffffff" opacity="0.85"/>
    <!-- 上眼睑阴影 -->
    <path d="M42.6 47.4q6.4-3.4 12.8-0.6" stroke="#6a52c9" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M64.6 46.8q6.4-2.8 12.8 0.6" stroke="#6a52c9" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.55"/>
  </g>
  <!-- 腮红 -->
  <ellipse cx="44" cy="62" rx="5" ry="3.2" fill="url(#cheekG)"/>
  <ellipse cx="76" cy="62" rx="5" ry="3.2" fill="url(#cheekG)"/>
  <!-- 嘴 -->
  <path d="M57 66.5q3 2.8 6 0" stroke="#d97f93" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- 漂浮星星 -->
  <g fill="#ffe08a">
    <path d="M17 26l1.3 2.8 3 .3-2.3 2 .7 3-2.7-1.6-2.7 1.6.7-3-2.3-2 3-.3z" opacity="0.9">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="3s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="3s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M103 62l1 2.2 2.4.2-1.8 1.7.5 2.4-2.2-1.3-2.2 1.3.5-2.4-1.8-1.7 2.4-.2z" opacity="0.8">
      <animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.4s" begin="0.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.5; 0 0" dur="3.4s" begin="0.8s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
