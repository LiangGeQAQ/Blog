  <g id="pet-3d">

    <!-- ========== 后发 + 躯干 + 腿（远层） ========== -->
    <g id="pet-chibi">

      <!-- 地面投影 -->
      <g id="pet-shadow">
        <ellipse cx="56" cy="216" rx="30" ry="4.2" fill="#6a5a92" opacity="0.2"/>
      </g>

      <!-- 后发 -->
      <path d="M56 4 C84 4 106 26 107 58 C108 92 105 132 101 166 C99 186 94 196 84 197 C86 166 87 132 84 108 C70 101 42 101 28 108 C25 132 26 166 28 197 C18 196 13 186 11 166 C7 132 4 92 5 58 C6 26 28 4 56 4 Z"
            fill="#e9e6f5" stroke="#8d84a8" stroke-width="1.1" stroke-linejoin="round"/>
      <g clip-path="url(#hairBackClip)">
        <!-- 一层硬阴影（右后侧） -->
        <path d="M56 4 L107 58 C108 92 105 132 101 166 C99 186 94 196 84 197 C86 166 87 132 84 108 C80 106 74 105 68 104 C70 130 70 160 68 197 L56 197 Z"
              fill="#d3cde8"/>
        <!-- 发梢切面 -->
        <path d="M28 197 L40 197 L38 188 L29 190 Z" fill="#cac2e2" opacity="0.85"/>
        <path d="M84 197 L72 197 L74 188 L83 190 Z" fill="#cac2e2" opacity="0.85"/>
      </g>

      <!-- 腿 -->
      <path d="M37 176 C33 185 31 196 32 204 C32.5 208 34 210 38 210 L45 210 C49 210 50 207 49.5 203 C48.5 194 48 185 47 176 Z"
