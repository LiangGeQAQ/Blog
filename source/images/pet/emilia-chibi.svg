<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 144" width="128" height="144" role="img" aria-label="银发紫瞳少女桌宠">
  <defs>
    <linearGradient id="hairTop" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#f0eefb"/>
      <stop offset="1" stop-color="#cbc6e4"/>
    </linearGradient>
    <linearGradient id="hairLock" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fbfaff"/>
      <stop offset="0.55" stop-color="#e2def4"/>
      <stop offset="1" stop-color="#bfb9db"/>
    </linearGradient>
    <linearGradient id="dressBody" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f1eefc"/>
      <stop offset="1" stop-color="#d7d0f0"/>
    </linearGradient>
    <!-- 桌面：俯视时上表面偏亮、侧面偏暗 -->
    <linearGradient id="deskTop" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#d9cdfb"/>
      <stop offset="0.55" stop-color="#b3a1f0"/>
      <stop offset="1" stop-color="#9a86e6"/>
    </linearGradient>
    <linearGradient id="deskFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b64d9"/>
      <stop offset="0.35" stop-color="#5f4cc0"/>
      <stop offset="1" stop-color="#41328c"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cab9ff"/>
      <stop offset="1" stop-color="#7b63e6"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a9e"/>
      <stop offset="0.55" stop-color="#7b68e0"/>
      <stop offset="1" stop-color="#ae9bf2"/>
    </linearGradient>
    <radialGradient id="skin" cx="0.44" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fffaf6"/>
      <stop offset="0.66" stop-color="#ffeade"/>
      <stop offset="1" stop-color="#f3d0c2"/>
    </radialGradient>
    <radialGradient id="blush" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9db6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff9db6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8"/>
    </filter>
    <filter id="soft2">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- ===== 后发 ===== -->
  <path d="M64 12c-21 0-34 14-34 32 0 9 1.6 16 3.8 22l-4.4 33c-0.7 4.4 2 6.6 5.8 6.6h57.6c3.8 0 6.5-2.2 5.8-6.6l-4.4-33c2.2-6 3.8-13 3.8-22 0-18-13-32-34-32z"
        fill="#cdc8e3"/>
  <path d="M64 14c-19 0-31 12-31 29 0 9 1.5 16 3.5 22l-4 32c-0.6 4 1.8 6 5.2 6h52.6c3.4 0 5.8-2 5.2-6l-4-32c2-6 3.5-13 3.5-22 0-17-12-29-31-29z"
        fill="url(#hairTop)"/>

  <!-- ===== 身体（略收肩，配合俯视） ===== -->
  <path d="M64 92c-14 0-23.5 6.6-26.4 16.4l-3.2 11h59.2l-3.2-11C87.5 98.6 78 92 64 92z" fill="url(#dressBody)"/>
  <path d="M64 92c-6.6 0-12.4 1.5-16.8 4.4C51.6 99.6 57.4 101.6 64 101.6s12.4-2 16.8-5.2C76.4 93.5 70.6 92 64 92z" fill="#ffffff" opacity="0.7"/>
  <path d="M52.4 95.8c3 6.4 7 9.6 11.6 9.6s8.6-3.2 11.6-9.6" fill="none" stroke="#9c88ee" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="translate(64,104.5)">
    <path d="M0 0l-8-4.4v8.8z" fill="url(#ribbon)"/>
    <path d="M0 0l8-4.4v8.8z" fill="url(#ribbon)"/>
    <path d="M0 0l-2.2 6.6 2.2 1.7 2.2-1.7z" fill="#6a55d6" opacity="0.9"/>
    <circle r="2.1" fill="#ffffff"/>
  </g>

  <!-- ===== 桌面（俯视：上表面 + 前侧立面 + 投影） ===== -->
  <ellipse cx="64" cy="132" rx="56" ry="7" fill="#33256f" opacity="0.32" filter="url(#soft)"/>
  <!-- 前侧立面 -->
  <path d="M2 124h124l-4 16H6z" fill="url(#deskFront)"/>
  <!-- 上表面（近边更宽，远边更窄 → 俯视透视） -->
  <path d="M13 110h102l11 14H2z" fill="url(#deskTop)"/>
  <!-- 上表面高光 + 边缘亮线 -->
  <path d="M16 112h96l7.5 9.5H8.5z" fill="#ffffff" opacity="0.16"/>
  <path d="M13 110h102" stroke="#efe9ff" stroke-width="1.6" stroke-linecap="round" opacity="0.75"/>
  <path d="M2 124h124" stroke="#3a2a80" stroke-width="1.2" opacity="0.5"/>

  <!-- ===== 手臂（搭在桌沿，近大远小） ===== -->
  <path d="M42 100c-6.4 3.6-10 9.6-10 15.4 0 2.6 2.2 4 4.6 4 3.6 0 5.8-2.4 6.8-5.8 1.2-4.4 2.4-9 4.4-11.2z" fill="#ffe9de"/>
  <path d="M86 100c6.4 3.6 10 9.6 10 15.4 0 2.6-2.2 4-4.6 4-3.6 0-5.8-2.4-6.8-5.8-1.2-4.4-2.4-9-4.4-11.2z" fill="#ffe9de"/>
  <path d="M33.4 106c-1.8 4.2-1.2 8.4 1.8 10.6 2.2 1.7 5.6 1.2 7.2-1" fill="none" stroke="#eec7b8" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
  <path d="M94.6 106c1.8 4.2 1.2 8.4-1.8 10.6-2.2 1.7-5.6 1.2-7.2-1" fill="none" stroke="#eec7b8" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
  <!-- 手背（更靠前、略大） -->
  <ellipse cx="35.6" cy="119" rx="7" ry="4.8" fill="#fff4ee"/>
  <ellipse cx="92.4" cy="119" rx="7" ry="4.8" fill="#fff4ee"/>
  <path d="M30.4 120q5.2 3.2 12.4 1" fill="none" stroke="#f0cdbf" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
  <path d="M97.6 120q-5.2 3.2-12.4 1" fill="none" stroke="#f0cdbf" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>

  <!-- ===== 脖子 ===== -->
  <path d="M56.6 78h14.8v11c0 3.4-3.2 5.6-7.4 5.6s-7.4-2.2-7.4-5.6z" fill="#f7d9cb"/>
  <ellipse cx="64" cy="87" rx="9.6" ry="4.2" fill="#3a2b86" opacity="0.22" filter="url(#soft2)"/>

  <!-- ===== 头部（转头 + 眨眼） ===== -->
  <g id="pet-head">
    <animateTransform attributeName="transform" type="rotate"
      values="0 64 88; -6.5 64 88; 0 64 88; 5.5 64 88; 0 64 88"
      keyTimes="0; 0.2; 0.48; 0.76; 1"
      calcMode="spline"
      keySplines="0.45 0 0.25 1; 0.45 0 0.25 1; 0.45 0 0.25 1; 0.45 0 0.25 1"
      dur="14s" repeatCount="indefinite"/>

    <!-- 脸：收窄下颌 + 微尖下巴（比正圆更写实） -->
    <path d="M64 30.5c13.4 0 23.6 9.8 23.6 23.5 0 9.6-2.4 17-7.4 22.6-4.4 5-10 8-16.2 8s-11.8-3-16.2-8c-5-5.6-7.4-13-7.4-22.6 0-13.7 10.2-23.5 23.6-23.5z"
          fill="url(#skin)"/>
    <!-- 下颌/脸侧阴影 -->
    <path d="M84.6 40c3.4 3.6 5 8.2 5 13.4 0 9-2.2 16-7 21.4-3.6 4-8 6.4-12.6 7 4 2.6 8.4 3.8 12.4 3.8 13.4 0 22.6-11 22.6-24 0-9.6-7-18.4-20.4-21.6z"
          fill="#e6b19f" opacity="0.26" filter="url(#soft2)"/>
    <!-- 下巴与颧骨高光 -->
    <path d="M58 76.4c2 1.6 4 2.4 6 2.4s4-0.8 6-2.4c-2 3.6-4 5.4-6 5.4s-4-1.8-6-5.4z" fill="#ffffff" opacity="0.35"/>

    <!-- 刘海 -->
    <path d="M39.4 52.4c0-15.6 11.6-26.4 24.6-26.4s24.6 10.8 24.6 26.4c0 3-0.6 5.4-1.8 7.6-2.2-7.4-6.2-10.8-11.2-11.8 1 4.2 0.6 7.6-1 10.6-2.2-6.4-6.2-9.6-11.2-10.2 0.6 3.2-0.6 6.4-2.8 8.6-2.2-5.4-5.4-7.6-9.4-7.6-3 0-5.8 1.6-8 4.2-2 2.2-3 5-3 7.4-1.8-2.2-2.8-5.2-2.8-8.8z"
          fill="url(#hairTop)"/>
    <path d="M45 36.4c4.2-8.2 11.6-12.2 20.2-12.2 7.4 0 13.6 2.8 17.8 8.8-3.2-2-7.4-3-11.6-3-9.6 0-18.6 2.2-26.4 6.4z" fill="#c6c1dd" opacity="0.58"/>
    <path d="M47.8 27.6c5.2-4.2 11.6-6.4 17.8-6.4 4.2 0 8.2 1 11.6 2.6-6.4-0.6-13.6 0.6-19.8 3-4.2 1.8-7.4 4.2-9.6 7.2z" fill="#ffffff" opacity="0.78"/>
    <path d="M58.4 30.4c-1.6 5.8-2 11.4-1 16.2M71 30.4c1.4 5.4 1.8 10.6 0.8 15" stroke="#d8d3ec" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.75"/>
    <!-- 侧发：贴合新的下颌线 -->
    <path d="M40.4 46c-4.4 10-5.4 21.6-4.2 33.4 0.6 6.4 2.6 9.8 6 11.2-2.4-12.2-2.8-27-1.8-44.6z" fill="url(#hairLock)"/>
    <path d="M87.6 46c4.4 10 5.4 21.6 4.2 33.4-0.6 6.4-2.6 9.8-6 11.2 2.4-12.2 2.8-27 1.8-44.6z" fill="url(#hairLock)"/>

    <!-- 发饰 -->
    <g transform="translate(89,34.5)">
      <g fill="#b9a7f5">
        <ellipse cx="0" cy="-5" rx="2.5" ry="3.4"/>
        <ellipse cx="4.6" cy="-1.5" rx="2.5" ry="3.4" transform="rotate(72 4.6 -1.5)"/>
        <ellipse cx="2.9" cy="3.9" rx="2.5" ry="3.4" transform="rotate(144 2.9 3.9)"/>
        <ellipse cx="-2.9" cy="3.9" rx="2.5" ry="3.4" transform="rotate(216 -2.9 3.9)"/>
        <ellipse cx="-4.6" cy="-1.5" rx="2.5" ry="3.4" transform="rotate(288 -4.6 -1.5)"/>
      </g>
      <circle r="2.1" fill="#fff3b0"/>
    </g>

    <!-- 眼睛 -->
    <g id="pet-eyes">
      <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.9;0.925;0.965;0.99;1" dur="7.5s" repeatCount="indefinite"/>
      <ellipse cx="53" cy="57.4" rx="5.4" ry="6.4" fill="url(#iris)"/>
      <ellipse cx="75" cy="57.4" rx="5.4" ry="6.4" fill="url(#iris)"/>
      <ellipse cx="53" cy="58.6" rx="3.1" ry="4" fill="#3b2c86" opacity="0.82"/>
      <ellipse cx="75" cy="58.6" rx="3.1" ry="4" fill="#3b2c86" opacity="0.82"/>
      <circle cx="54.8" cy="54.8" r="1.5" fill="#ffffff" opacity="0.9"/>
      <circle cx="76.8" cy="54.8" r="1.5" fill="#ffffff" opacity="0.9"/>
      <circle cx="51.6" cy="60.8" r="0.75" fill="#ffffff" opacity="0.55"/>
      <circle cx="73.6" cy="60.8" r="0.75" fill="#ffffff" opacity="0.55"/>
      <path d="M47.6 52.2q5.4-2.6 10.8-0.4" stroke="#54429f" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.58"/>
      <path d="M69.6 51.8q5.4-2.2 10.8 0.4" stroke="#54429f" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.58"/>
    </g>
    <g id="pet-eyes-closed" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.9;0.925;0.965;0.99;1" dur="7.5s" repeatCount="indefinite"/>
      <path d="M48 58q5 2.5 10 0" stroke="#6b57bd" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M70 58q5 2.5 10 0" stroke="#6b57bd" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 眉 -->
    <path d="M47 45.4q5.2-2 10-.4M71 45q4.8-1.6 10 .4" stroke="#c1bbdb" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.85"/>
    <!-- 腮红（压在下颌内） -->
    <ellipse cx="48.4" cy="66.6" rx="5" ry="3" fill="url(#blush)"/>
    <ellipse cx="79.6" cy="66.6" rx="5" ry="3" fill="url(#blush)"/>
    <!-- 嘴 -->
    <path d="M60.8 71.6q3.2 2.6 6.4 0" stroke="#d98195" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== 漂浮星星 ===== -->
  <g fill="#ffe08a">
    <path d="M17 28l1.5 3.2 3.4.4-2.6 2.3.8 3.4-3.1-1.9-3.1 1.9.8-3.4-2.6-2.3 3.4-.4z" opacity="0.85">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="3.4s" begin="0s" repeatCount="indefinite"/>
    </path>
    <path d="M112 64l1.1 2.4 2.6.3-2 1.8.6 2.6-2.4-1.4-2.4 1.4.6-2.6-2-1.8 2.6-.3z" opacity="0.75">
      <animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.8s" begin="0.9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.6; 0 0" dur="3.8s" begin="0.9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
