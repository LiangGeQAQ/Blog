      <path d="M75 176 C79 185 81 196 80 204 C79.5 208 78 210 74 210 L67 210 C63 210 62 207 62.5 203 C63.5 194 64 185 65 176 Z"
            fill="#fdeee6" stroke="#b98a77" stroke-width="1.05" stroke-linejoin="round"/>
      <g clip-path="url(#legLClip)"><path d="M47 176 C48 186 48.5 196 49.5 203 C49 208 46 210 43 210 L49 210 Z" fill="#f2d3c6"/></g>
      <g clip-path="url(#legRClip)"><path d="M65 176 C64 186 63.5 196 62.5 203 C63 208 66 210 69 210 L63 210 Z" fill="#f2d3c6"/></g>

      <!-- 鞋 -->
      <path d="M32 202 C29 208 30 215 36 216 C42 217 48 214 49 207 C49.5 202 46 200 41 200 C36 200 33.5 200.5 32 202 Z"
            fill="#a894f0" stroke="#7a67c4" stroke-width="1.05" stroke-linejoin="round"/>
      <path d="M80 202 C83 208 82 215 76 216 C70 217 64 214 63 207 C62.5 202 66 200 71 200 C76 200 78.5 200.5 80 202 Z"
            fill="#a894f0" stroke="#7a67c4" stroke-width="1.05" stroke-linejoin="round"/>
      <path d="M34 206 C37 205 43 205 47 206" fill="none" stroke="#ffffff" stroke-width="1.1" opacity="0.6" stroke-linecap="round"/>
      <path d="M78 206 C75 205 69 205 65 206" fill="none" stroke="#ffffff" stroke-width="1.1" opacity="0.6" stroke-linecap="round"/>

      <!-- 裙子 -->
      <path d="M56 146 C74 146 92 150 98 158 C102 164 104 172 104 180 C86 186 26 186 8 180 C8 172 10 164 14 158 C20 150 38 146 56 146 Z"
            fill="#fbfaff" stroke="#9c93b8" stroke-width="1.1" stroke-linejoin="round"/>
      <g clip-path="url(#skirtClip)">
        <path d="M56 146 C74 146 92 150 98 158 C102 164 104 172 104 180 L104 186 L64 186 C66 172 62 158 56 146 Z" fill="#ddd8ee"/>
        <path d="M30 158 C34 168 36 176 36 184" fill="none" stroke="#c8c0e0" stroke-width="1" stroke-linecap="round"/>
        <path d="M82 158 C78 168 76 176 76 184" fill="none" stroke="#c8c0e0" stroke-width="1" stroke-linecap="round"/>
        <path d="M8 176 C26 182 86 182 104 176 L104 180 C86 186 26 186 8 180 Z" fill="#cdc5e6" opacity="0.9"/>
      </g>

      <!-- 长袍前襟图腾（似魔之鸟，线稿简化） -->
      <g transform="translate(56,166)" fill="none" stroke="#a894f0" stroke-width="1.15" stroke-linejoin="round" stroke-linecap="round" opacity="0.95">
        <path d="M0 -13 C4.6 -13 7.6 -9.6 7.6 -5.2 C7.6 -1 4.6 2.6 0 2.6 C-4.6 2.6 -7.6 -1 -7.6 -5.2 C-7.6 -9.6 -4.6 -13 0 -13 Z"/>
        <path d="M0 -13 C-1.6 -16.4 -4.4 -17.6 -6.8 -17 C-5.4 -14.4 -3.4 -12.8 0 -13"/>
        <path d="M0 -13 C1.6 -16.4 4.4 -17.6 6.8 -17 C5.4 -14.4 3.4 -12.8 0 -13"/>
        <path d="M-7.4 -3.4 C-12.6 -1 -15.4 3.4 -14.6 7.4 C-11 5.4 -8.2 2.2 -7.4 -3.4"/>
        <path d="M7.4 -3.4 C12.6 -1 15.4 3.4 14.6 7.4 C11 5.4 8.2 2.2 7.4 -3.4"/>
        <path d="M-2.4 2.2 C-2.8 6.4 -1.6 10 0 12.6 C1.6 10 2.8 6.4 2.4 2.2"/>
        <path d="M-3.2 -6.4 C-1.6 -7.4 1.6 -7.4 3.2 -6.4" stroke-width="0.9"/>
      </g>

      <!-- 躯干 -->
      <path d="M56 114 C72 114 88 117 96 123 C101 127 102 134 100 140 C98 146 96 149 94 151 C80 156 32 156 18 151 C16 149 14 146 12 140 C10 134 11 127 16 123 C24 117 40 114 56 114 Z"
            fill="#fbfaff" stroke="#9c93b8" stroke-width="1.1" stroke-linejoin="round"/>
      <g clip-path="url(#torsoClip)">
        <!-- 一层硬阴影 -->
        <path d="M56 114 C72 114 88 117 96 123 C101 127 102 134 100 140 C98 146 96 149 94 151 C88 153 82 154 76 155 C78 143 72 128 62 122 C60 120 58 117 56 114 Z"
